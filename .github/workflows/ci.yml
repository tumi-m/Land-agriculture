name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded runs on the same ref are cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Keep in step with the devcontainer.
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run budget

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts serves `next start` on CI, so there has to be a
      # build to serve.
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: shots
          path: test-results/shots/
          retention-days: 7